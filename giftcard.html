<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gift Card · Huellas</title>
<link rel="icon" href="img/corazon-icono.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--yeso:#F5F1EA;--tinta:#16222B;--oro:#C9A25A;--borde:#E2D8C6;--wa:#25D366}
*{box-sizing:border-box;margin:0}
body{font-family:"Bricolage Grotesque",system-ui,sans-serif;background:var(--yeso);color:var(--tinta);padding:28px 16px 60px;-webkit-font-smoothing:antialiased}
main{max-width:820px;margin:0 auto}
h1{font-size:clamp(1.7rem,5vw,2.4rem);font-weight:700;letter-spacing:-.03em}
.bajada{margin:6px 0 22px;color:#4A5A66;line-height:1.45}
canvas{width:100%;height:auto;border-radius:14px;box-shadow:0 24px 50px -24px rgba(22,34,43,.45);display:block;background:#fff}
form{display:grid;gap:14px;margin:24px 0}
label{display:grid;gap:6px;font-weight:600;font-size:.95rem}
input{font:inherit;font-weight:400;font-size:1.05rem;padding:13px 14px;border:1.5px solid var(--borde);border-radius:12px;background:#fff;color:var(--tinta);width:100%}
input:focus{outline:none;border-color:var(--oro);box-shadow:0 0 0 3px rgba(201,162,90,.25)}
.botones{display:flex;flex-wrap:wrap;gap:10px}
button{font:inherit;font-weight:600;font-size:1rem;padding:14px 20px;border-radius:999px;border:0;cursor:pointer;flex:1 1 200px}
.b1{background:var(--tinta);color:var(--yeso)}
.b2{background:var(--wa);color:#fff}
.b3{background:#fff;color:var(--tinta);border:1.5px solid var(--borde)}
.volver{display:inline-block;margin-bottom:14px;color:#6A7884;text-decoration:none;font-weight:600}
.nota{margin-top:14px;font-size:.88rem;color:#6A7884}
</style>
</head>
<body>
<main>
  <a class="volver" href="admin.html">← Panel</a>
  <h1>Gift Card</h1>
  <p class="bajada">Completá los datos y descargala para mandarla por WhatsApp o mail, o para imprimirla.</p>
  <canvas id="cv" width="1800" height="1200" aria-label="Vista previa de la gift card"></canvas>
  <form id="f" autocomplete="off">
    <label>Para<input id="para" maxlength="40" placeholder="Ej: Sofía y Martín"></label>
    <label>De<input id="de" maxlength="40" placeholder="Ej: los abuelos"></label>
    <label>Regalo<input id="regalo" maxlength="45" placeholder="Ej: Cuadro de 1 pieza"></label>
  </form>
  <div class="botones">
    <button class="b2" id="compartir" type="button" hidden>Compartir (WhatsApp, mail…)</button>
    <button class="b1" id="bajar" type="button">Descargar imagen</button>
    <button class="b3" id="imprimir" type="button">Imprimir</button>
  </div>
  <p class="nota">Si dejás un campo vacío, queda la línea en blanco para completarla a mano.</p>
</main>
<script>
try { if (localStorage.getItem('huellas-admin') !== '1') location.replace('admin.html?ir=giftcard'); } catch (e) { location.replace('admin.html?ir=giftcard'); }
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const base = new Image(); base.src = 'img/giftcard-base.jpg';
/* renglones de la tarjeta: dónde empieza el texto, dónde termina la línea y su altura */
const RENGLONES = [['para', 232, 760], ['de', 188, 870], ['regalo', 266, 980]];
const FIN = 740, TAM = 70;
const campos = Object.fromEntries(RENGLONES.map(([id]) => [id, document.getElementById(id)]));
function dibujar() {
  if (!base.complete || !base.naturalWidth) return;
  cx.drawImage(base, 0, 0, 1800, 1200);
  cx.fillStyle = '#16222B'; cx.textBaseline = 'alphabetic';
  RENGLONES.forEach(([id, x, y]) => {
    const t = campos[id].value.trim(); if (!t) return;
    let tam = TAM; cx.font = `600 ${tam}px Caveat`;
    while (cx.measureText(t).width > FIN - x - 10 && tam > 34) { tam -= 2; cx.font = `600 ${tam}px Caveat`; }
    const w = cx.measureText(t).width;
    /* tapa los puntitos detrás del texto para que se lea limpio */
    const g = cx.createLinearGradient(0, 0, 1800, 1200); g.addColorStop(0, '#FFFDF9'); g.addColorStop(1, '#F1E7D6');
    cx.fillStyle = g; cx.fillRect(x - 16, y - tam, w + 16, tam + 22);
    cx.fillStyle = '#16222B'; cx.fillText(t, x + 4, y);
  });
}
function nombreArchivo() {
  const p = campos.para.value.trim().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '-').replace(/^-|-$/g, '').toLowerCase();
  return 'giftcard-huellas' + (p ? '-' + p : '') + '.jpg';
}
const blob = () => new Promise(r => cv.toBlob(r, 'image/jpeg', 0.92));
document.getElementById('bajar').onclick = async () => {
  const a = document.createElement('a'); a.href = URL.createObjectURL(await blob()); a.download = nombreArchivo(); a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};
const btnC = document.getElementById('compartir');
if (navigator.canShare && navigator.canShare({ files: [new File([''], 'x.jpg', { type: 'image/jpeg' })] })) {
  btnC.hidden = false;
  btnC.onclick = async () => {
    const f = new File([await blob()], nombreArchivo(), { type: 'image/jpeg' });
    try { await navigator.share({ files: [f], title: 'Gift Card Huellas' }); } catch (e) {}
  };
}
document.getElementById('imprimir').onclick = () => {
  const w = window.open('', '_blank'); if (!w) return;
  w.document.write(`<!doctype html><title>Gift Card</title><style>@page{size:15.24cm 10.16cm;margin:0}html,body{margin:0}img{width:15.24cm;height:10.16cm;display:block}</style><img src="${cv.toDataURL('image/jpeg', 0.95)}" onload="setTimeout(()=>{print()},200)">`);
  w.document.close();
};
Object.values(campos).forEach(i => i.addEventListener('input', dibujar));
base.onload = dibujar;
document.fonts.load('600 70px Caveat').then(dibujar);
</script>
</body>
</html>
