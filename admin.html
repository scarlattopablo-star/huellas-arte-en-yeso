<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administración · Huellas</title>
<link rel="icon" href="img/corazon-icono.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
:root{--yeso:#F5F1EA;--tinta:#16222B;--oro:#C9A25A;--borde:#E2D8C6}
*{box-sizing:border-box;margin:0}
body{font-family:"Bricolage Grotesque",system-ui,sans-serif;background:var(--yeso);color:var(--tinta);min-height:100svh;padding:40px 16px;-webkit-font-smoothing:antialiased}
main{max-width:480px;margin:0 auto}
.logo{width:72px;display:block;margin-bottom:18px}
h1{font-size:2rem;font-weight:700;letter-spacing:-.03em}
p{color:#4A5A66;line-height:1.45;margin:6px 0 24px}
form{display:grid;gap:12px}
input{font:inherit;font-size:1.1rem;padding:14px;border:1.5px solid var(--borde);border-radius:12px;background:#fff;width:100%}
input:focus{outline:none;border-color:var(--oro);box-shadow:0 0 0 3px rgba(201,162,90,.25)}
button{font:inherit;font-weight:600;font-size:1rem;padding:14px 20px;border-radius:999px;border:0;cursor:pointer;background:var(--tinta);color:var(--yeso)}
.campo{position:relative}
.campo input{padding-right:56px}
.ojo{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;padding:0;border-radius:10px;background:none;display:grid;place-items:center;color:#6A7884}
.ojo svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ojo[aria-pressed="true"] .tacha{display:none}
.error{color:#B3412F;font-weight:600;min-height:1.4em}
.herr{display:grid;gap:12px}
.herr a{display:flex;align-items:center;gap:16px;padding:18px;border-radius:16px;background:#fff;border:1.5px solid var(--borde);color:inherit;text-decoration:none}
.herr a:hover{border-color:var(--oro)}
.herr i{font-style:normal;font-size:1.8rem}
.herr b{display:block;font-size:1.1rem}
.herr small{color:#6A7884}
.salir{margin-top:28px;background:none;color:#6A7884;text-decoration:underline;padding:0}
</style>
</head>
<body>
<main>
  <img class="logo" src="img/corazon.png" alt="Huellas">
  <section id="login">
    <h1>Administración</h1>
    <p>Ingresá la contraseña para usar las herramientas de Huellas.</p>
    <form id="f">
      <div class="campo"><input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password" required><button type="button" class="ojo" id="ojo" aria-label="Mostrar contraseña" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="tacha" d="M3 3l18 18"/></svg></button></div>
      <button>Entrar</button>
      <div class="error" id="err" role="alert"></div>
    </form>
  </section>
  <section id="panel" hidden>
    <h1>Hola, Tathiana 🤍</h1>
    <p>Herramientas para el día a día.</p>
    <div class="herr">
      <a href="giftcard.html"><i>🎁</i><span><b>Gift Card</b><small>Completar, descargar, compartir o imprimir</small></span></a>
    </div>
    <button class="salir" id="salir" type="button">Cerrar sesión</button>
  </section>
</main>
<script>
const CLAVE = '300cbc4d5872a050a5c87dd7869292d012878a67f3cf8226b81cef21f2d9207f';
const leer = () => { try { return localStorage.getItem('huellas-admin') === '1'; } catch (e) { return false; } };
const guardar = v => { try { v ? localStorage.setItem('huellas-admin', '1') : localStorage.removeItem('huellas-admin'); } catch (e) {} };
function mostrar() {
  document.getElementById('login').hidden = true; document.getElementById('panel').hidden = false;
  const ir = new URLSearchParams(location.search).get('ir');
  if (ir === 'giftcard') location.replace('giftcard.html');
}
async function hash(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  if (await hash(document.getElementById('clave').value.trim()) === CLAVE) { guardar(true); mostrar(); }
  else document.getElementById('err').textContent = 'Contraseña incorrecta.';
});
const ojo = document.getElementById('ojo'), clave = document.getElementById('clave');
ojo.onclick = () => { const ver = clave.type === 'password'; clave.type = ver ? 'text' : 'password'; ojo.setAttribute('aria-pressed', ver); ojo.setAttribute('aria-label', ver ? 'Ocultar contraseña' : 'Mostrar contraseña'); clave.focus(); };
document.getElementById('salir').onclick = () => { guardar(false); location.replace('admin.html'); };
if (leer()) mostrar();
</script>
</body>
</html>
